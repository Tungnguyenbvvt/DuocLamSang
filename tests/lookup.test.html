<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Ca kiểm thử – module tra cứu</title>
<style>
  body{font-family:system-ui,sans-serif;margin:16px;font-size:14px}
  .pass{color:#1b6b34}.fail{color:#b3261e;font-weight:700}
  #sum{font-size:16px;font-weight:700;margin-bottom:10px}
</style>
</head>
<body>
<div id="sum"></div>
<ol id="out"></ol>
<script src="../js/search.js"></script>
<script src="../js/modules/lookup.js"></script>
<script>
  // Dữ liệu kiểm thử tổng hợp (mã X.. giả), không phải dữ liệu lâm sàng.
  var T = Lookup._test, results = [];
  function eq(name, got, want) {
    var ok = JSON.stringify(got) === JSON.stringify(want);
    results.push({ name: name, ok: ok, got: got, want: want });
  }
  var cfg = { codeField: 'code', searchFields: ['code', 'name', 'chapter'] };
  var recs = T.prepare([
    { code: 'X01.1', name: 'Bệnh thử nghiệm đường hô hấp', chapter: 'Chương 1' },
    { code: 'X01', name: 'Bệnh thử nghiệm chung', chapter: 'Chương 1' },
    { code: 'Y20', name: 'Đau đầu thử nghiệm', chapter: 'Chương 2' },
    { code: 'Z9', name: 'Mục khác X01 trong tên', chapter: 'Chương 2' }
  ], cfg);
  function codes(list) { return list.map(function (r) { return r.code; }); }

  eq('norm bỏ dấu và đ/Đ', T.norm('Đái Tháo Đường'), 'dai thao duong');
  eq('tokens tách khoảng trắng thừa', T.tokens('  tang   huyet '), ['tang', 'huyet']);
  eq('chuỗi rỗng trả toàn bộ, giữ thứ tự gốc', codes(T.search(recs, '', cfg, {})), ['X01.1', 'X01', 'Y20', 'Z9']);
  eq('chỉ khoảng trắng = rỗng', codes(T.search(recs, '   ', cfg, {})), ['X01.1', 'X01', 'Y20', 'Z9']);
  eq('khớp đúng mã xếp đầu', codes(T.search(recs, 'x01', cfg, {})), ['X01', 'X01.1', 'Z9']);
  eq('mã có chấm khớp đúng', codes(T.search(recs, 'X01.1', cfg, {})), ['X01.1']);
  eq('tìm không dấu trên tên có dấu', codes(T.search(recs, 'dau dau', cfg, {})), ['Y20']);
  eq('nhiều từ khóa = AND', codes(T.search(recs, 'benh ho hap', cfg, {})), ['X01.1']);
  eq('từ khóa không tồn tại', codes(T.search(recs, 'benh zzz', cfg, {})), []);
  eq('lọc trường đơn', codes(T.search(recs, '', cfg, { chapter: 'Chương 2' })), ['Y20', 'Z9']);
  eq('lọc + tìm kết hợp', codes(T.search(recs, 'x01', cfg, { chapter: 'Chương 2' })), ['Z9']);
  eq('bộ lọc rỗng bị bỏ qua', codes(T.search(recs, '', cfg, { chapter: null })), ['X01.1', 'X01', 'Y20', 'Z9']);

  // Mã không dấu chấm, ký hiệu †/*, xếp hạng tên trước hướng dẫn
  var cfg3 = { codeField: 'code', searchFields: ['code', 'name', 'guide'], primaryFields: ['name'] };
  var recs3 = T.prepare([
    { code: 'K10', name: 'Bệnh thử A', guide: 'Bao gồm: sốt kéo dài' },
    { code: 'K11.0†', name: 'Sốt thử nghiệm', guide: '' },
    { code: 'K12*', name: 'Bệnh thử C', guide: 'Loại trừ: sốt cao' },
    { code: 'K12.1', name: 'Sốt kéo dài thử', guide: '' }
  ], cfg3);
  eq('codeKey bỏ dấu chấm và †/*', [T.codeKey('K11.0†'), T.codeKey('k12*'), T.codeKey(' a00.0 ')], ['k110', 'k12', 'a000']);
  eq('tìm mã không gõ dấu chấm', codes(T.search(recs3, 'k110', cfg3, {})), ['K11.0†']);
  eq('mã có † vẫn khớp đúng mã', codes(T.search(recs3, 'K11.0', cfg3, {})), ['K11.0†']);
  eq('mã có * khớp đúng xếp trước mã con', codes(T.search(recs3, 'k12', cfg3, {})), ['K12*', 'K12.1']);
  eq('khớp tên xếp trước chỉ khớp hướng dẫn', codes(T.search(recs3, 'sot', cfg3, {})), ['K11.0†', 'K12.1', 'K10', 'K12*']);
  eq('nhiều từ: tên khớp đủ xếp trước', codes(T.search(recs3, 'sot keo dai', cfg3, {})), ['K12.1', 'K10']);
  var recs5 = T.prepare([
    { code: 'M10.2', name: 'Bệnh thử típ 1', guide: '' },
    { code: 'M11', name: 'Bệnh thử típ 2', guide: '' }
  ], cfg3);
  eq('số trong từ khóa không xếp hạng theo mã', codes(T.search(recs5, 'benh thu tip 2', cfg3, {})), ['M11', 'M10.2']);
  var recs4 = T.prepare([{ code: 'Q1', name: 'A', flags: ['female', 'notPrimary'] }, { code: 'Q2', name: 'B' }, { code: 'Q3', name: 'C', flags: ['male'] }], cfg3);
  eq('lọc cờ (trường mảng, bản ghi thiếu trường)', codes(T.search(recs4, '', cfg3, { flags: 'female' })), ['Q1']);

  var cfg2 = { codeField: null, searchFields: ['name'] };
  var drugs = T.prepare([
    { name: 'Thuốc A', tiers: ['dbI', 'II'] },
    { name: 'Thuốc B', tiers: ['dbI'] },
    { name: 'Thuốc C', tiers: [] }
  ], cfg2);
  eq('lọc trường mảng (hạng BV)', T.search(drugs, '', cfg2, { tiers: 'II' }).map(function (r) { return r.name; }), ['Thuốc A']);
  eq('không có codeField vẫn tìm được', T.search(drugs, 'thuoc b', cfg2, {}).map(function (r) { return r.name; }), ['Thuốc B']);

  eq('tô sáng giữ nguyên dấu', T.highlight('Tăng áp', ['tang']), '<mark>Tăng</mark> áp');
  eq('không tô từ khóa 1 ký tự khi có từ khóa khác', T.highlight('típ 2 E12', ['tip', '2']), '<mark>típ</mark> 2 E12');
  eq('vẫn tô khi từ khóa 1 ký tự là duy nhất', T.highlight('E12', ['2']), 'E1<mark>2</mark>');
  eq('thoát ký tự HTML', T.highlight('<b>&', []), '&lt;b&gt;&amp;');
  eq('tô sáng + thoát HTML', T.highlight('a<b', ['a']), '<mark>a</mark>&lt;b');

  function throws(fn) { try { fn(); return false; } catch (e) { return true; } }
  eq('validate: hợp lệ', throws(function () { T.validate({ version: '1', updated: '2026-10-28', source: 's', records: [] }); }), false);
  eq('validate: thiếu records', throws(function () { T.validate({ version: '1', updated: '2026-10-28', source: 's' }); }), true);
  eq('validate: thiếu source', throws(function () { T.validate({ version: '1', updated: '2026-10-28', records: [] }); }), true);
  eq('validate: sai định dạng ngày', throws(function () { T.validate({ version: '1', updated: '28/10/2026', source: 's', records: [] }); }), true);

  // Xếp theo mức liên quan
  var S = T.S, cfg6 = { codeField: 'code', searchFields: ['code', 'name', 'guide'], primaryFields: ['name'] };
  var recs6 = T.prepare([
    { code: 'A1', name: 'Nhiễm thử không gây viêm phổi', guide: '' },
    { code: 'B1', name: 'Bệnh thử X', guide: 'có viêm phổi' },
    { code: 'J2', name: 'Viêm phổi do tác nhân thử dài hơn', guide: '' },
    { code: 'J1', name: 'Viêm phổi, tác nhân thử', guide: '' },
    { code: 'J3', name: 'Viêm phổi', guide: '' },
    { code: 'C1', name: 'Phổi thử viêm', guide: '' }
  ], cfg6);
  eq('đúng cụm > bắt đầu > trong tên > rải rác > chỉ hướng dẫn', codes(T.search(recs6, 'viem phoi', cfg6, {})), ['J3', 'J1', 'J2', 'A1', 'C1', 'B1']);

  // Từ điển đồng nghĩa (mục giả, không phải dữ liệu lâm sàng)
  var dict = S.buildDict({ entries: [
    { term: 'ĐTT', to: ['đau đầu thử'] }, { term: 'Biệt Thử', to: ['chất một', 'chất hai'] }, { term: 'Đã Tắt', to: ['chất một'], active: false }
  ] });
  var recs7 = T.prepare([
    { code: 'D1', name: 'Đau đầu thử nghiệm', guide: '' }, { code: 'D2', name: 'Chất một', guide: '' },
    { code: 'D3', name: 'Chất hai dạng tiêm', guide: '' }, { code: 'D4', name: 'Amoxicilin', guide: '' },
    { code: 'D5', name: 'Ceftriaxon', guide: '' }, { code: 'D6', name: 'Cefalexin', guide: '' }
  ], cfg6);
  function run(q) { return codes(S.run(recs7, q, {}, dict).list); }
  eq('viết tắt có dấu đ, gõ không dấu', run('dtt'), ['D1']);
  eq('biệt dược ra mọi hoạt chất', run('biệt thử'), ['D2', 'D3']);
  eq('báo mục từ điển đã dùng', S.run(recs7, 'biet thu', {}, dict).used.length, 2);
  eq('mục đã tắt không có hiệu lực', run('da tat'), []);
  eq('từ khóa kèm từ khác vẫn mở rộng', run('dtt nghiem'), ['D1']);
  eq('không khớp giữa từ', S.expand('xdtt', dict).length, 0);
  eq('gần đúng: ll', run('amoxicillin'), ['D4']);
  eq('gần đúng: e cuối', run('ceftriaxone'), ['D5']);
  eq('gần đúng: ph', run('cephalexin'), ['D6']);
  eq('báo kết quả gần đúng', S.run(recs7, 'amoxicillin', {}, dict).fuzzy, true);
  eq('khớp đúng thì không dùng gần đúng', S.run(recs7, 'amoxicilin', {}, dict).fuzzy, false);
  eq('không có từ điển vẫn chạy', S.run(recs7, 'chat mot', {}, null).list.length, 1);

  var fail = results.filter(function (r) { return !r.ok; }).length;
  document.getElementById('sum').innerHTML = '<span class="' + (fail ? 'fail' : 'pass') + '">' + (results.length - fail) + '/' + results.length + ' ca đạt</span>';
  document.getElementById('out').innerHTML = results.map(function (r) {
    return '<li class="' + (r.ok ? 'pass' : 'fail') + '">' + (r.ok ? 'ĐẠT' : 'LỖI') + ' – ' + r.name +
      (r.ok ? '' : ' | nhận: ' + JSON.stringify(r.got) + ' | cần: ' + JSON.stringify(r.want)) + '</li>';
  }).join('');
  window.TEST_RESULT = { total: results.length, fail: fail };
</script>
</body>
</html>
